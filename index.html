<style>
  :root{
    --bg:#0E1118;
    --panel:#171B26;
    --panel-2:#1F2432;
    --line:rgba(245,243,238,0.08);
    --text:#F5F3EE;
    --muted:#8B92A6;
    --amber:#F2B84B;
    --amber-dim:#7A5F27;
    --coral:#FF6F59;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Landing ---------- */
  .landing{
    flex:1;

import {
  getDatabase, ref, set, update, get, remove, onValue, onChildAdded,

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged,
  setPersistence, browserLocalPersistence, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const ROOM_TTL_HOURS = 24;
const ROOM_TTL_MS = ROOM_TTL_HOURS * 60 * 60 * 1000;

   General → "Your apps" → ícono web </> → Firebase SDK snippet.

const firebaseConfig = {

  authDomain: "juntos-17c7c.firebaseapp.com",

  messagingSenderId: "619893964828",
  appId: "1:619893964828:web:e901b59163e629d7215fd9"
};

const isConfigured = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("PEGA_") !== 0;

let app, db, auth;
if (isConfigured) {
  app = initializeApp(firebaseConfig);
  db = getDatabase(app);
  auth = getAuth(app);
  setPersistence(auth, browserLocalPersistence).catch(function(err){
    console.error("No se pudo activar la persistencia de sesión:", err);
  });
}

/* ---------------- Firebase Authentication ---------------- */
if (isConfigured && auth) {
  const emailInput = document.getElementById("authEmail");
  const passwordInput = document.getElementById("authPassword");
  const loginBtn = document.getElementById("authLoginBtn");
  const errorEl = document.getElementById("authError");
  const rememberedEmail = localStorage.getItem("juntosLoginEmail") || "";
  emailInput.value = rememberedEmail;

  async function loginJuntos(){
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    errorEl.textContent = "";
    if (!email || !password) {
      errorEl.textContent = "Escribe el correo y la contraseña.";
      return;
    }
    loginBtn.disabled = true;
    try {
      await setPersistence(auth, browserLocalPersistence);
      await signInWithEmailAndPassword(auth, email, password);
      localStorage.setItem("juntosLoginEmail", email);
      passwordInput.value = "";
    } catch (err) {
      console.error(err);
      errorEl.textContent = "No se pudo iniciar sesión. Revisa el correo y la contraseña.";
    } finally {
      loginBtn.disabled = false;
    }
  }

  loginBtn.addEventListener("click", loginJuntos);
  passwordInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") loginJuntos();
  });

  document.getElementById("authLogoutBtn").addEventListener("click", async function(){
    await signOut(auth);
  });

  onAuthStateChanged(auth, function(user){
    const authScreen = document.getElementById("authScreen");
    const appEl = document.getElementById("app");
    const userBox = document.getElementById("authUserBox");
    const userEmail = document.getElementById("authUserEmail");

    if (user) {
      authScreen.classList.add("hidden");
      appEl.classList.remove("hidden");
      userBox.classList.remove("hidden");
      userEmail.textContent = user.email || "Sesión iniciada";
    } else {
      authScreen.classList.remove("hidden");
      appEl.classList.add("hidden");
      userBox.classList.add("hidden");
      userEmail.textContent = "";
    }
  });
}

  }
  function parseYouTubeInput(raw){
    if (!raw) return null;
    raw = raw.trim();

    // ID directo de video
    if (/^[\w-]{11}$/.test(raw)) {
      return { type: "video", videoId: raw, playlistId: null, index: 0 };
    }

    // ID directo de playlist (normalmente comienza por PL, RD, UU, OL...)
    if (/^[A-Za-z0-9_-]{12,}$/.test(raw) && !raw.includes("/") && !raw.includes(".")) {
      return { type: "playlist", videoId: null, playlistId: raw, index: 0 };
    }

    try {
      var u = new URL(raw);
      var host = u.hostname.replace(/^www\./, "");
      if (host !== "youtube.com" && host !== "m.youtube.com" && host !== "youtu.be" && host !== "music.youtube.com") return null;

      var playlistId = u.searchParams.get("list");
      var videoId = null;
      var index = parseInt(u.searchParams.get("index") || "0", 10);
      if (!Number.isFinite(index) || index < 0) index = 0;

      if (host === "youtu.be") {
        videoId = u.pathname.split("/").filter(Boolean)[0] || null;
      } else {
        videoId = u.searchParams.get("v");
        if (!videoId) {
          var parts = u.pathname.split("/").filter(Boolean);
          if (["embed", "live", "shorts"].includes(parts[0])) videoId = parts[1] || null;
        }
      }

      if (playlistId) return { type: "playlist", videoId: videoId, playlistId: playlistId, index: index };
      if (videoId && /^[\w-]{11}$/.test(videoId)) return { type: "video", videoId: videoId, playlistId: null, index: 0 };
    } catch(e) {}
    return null;
  }
  function escapeHtml(str){
    var d = document.createElement("div");
    d.textContent = str == null ? "" : String(str);
    return d.innerHTML;
  }

  /* ---------------- Firebase refs ---------------- */
  function videoRef(code){ return ref(db, "rooms/" + code + "/video"); }
  function participantsRef(code){ return ref(db, "rooms/" + code + "/participants"); }
  function participantRef(code, id){ return ref(db, "rooms/" + code + "/participants/" + id); }
  function chatRef(code){ return ref(db, "rooms/" + code + "/chat"); }
  function reactionsRef(code){ return ref(db, "rooms/" + code + "/reactions"); }

  /* ---------------- not configured yet: block usage with a clear message ---------------- */
  if (!isConfigured){
    document.addEventListener("DOMContentLoaded", function(){
      $("landingErr").textContent = "Esta app aún no tiene su base de datos configurada (falta pegar la configuración de Firebase en el código).";
      $("createBtn").disabled = true;
      $("joinBtn").disabled = true;
    });
  }

  /* ---------------- landing ---------------- */
  $("createBtn").addEventListener("click", async function(){
    if (!isConfigured || !auth || !auth.currentUser) return;
    var name = $("nameInput").value.trim();
    if (!name){ $("landingErr").textContent = "Escribe tu nombre para continuar."; return; }
    myName = name;
    var code = genRoomCode();
    $("createBtn").disabled = true;
    try {
      var expiresAt = Date.now() + ROOM_TTL_MS;
      await set(videoRef(code), { videoId: null, playlistId: null, playlistIndex: 0, isPlaying: false, positionSec: 0, updatedAt: Date.now(), updatedBy: null, expiresAt: expiresAt });
      await joinAsParticipant(code);
      await push(chatRef(code), sysMsg(myName + " creó la sala 🎬"));
      enterRoom(code);
    } catch(e){
      console.error(e);
      $("landingErr").textContent = "No se pudo crear la sala. Revisa tu conexión e intenta de nuevo.";
    } finally {
      $("createBtn").disabled = false;
    }
  });

  $("joinBtn").addEventListener("click", async function(){
    if (!auth || !auth.currentUser) return;
    if (!isConfigured) return;
    var name = $("nameInput").value.trim();
    var code = $("codeInput").value.trim().toUpperCase();
    if (!name){ $("landingErr").textContent = "Escribe tu nombre para continuar."; return; }
    if (!code){ $("landingErr").textContent = "Escribe el código de la sala."; return; }
    myName = name;
    $("joinBtn").disabled = true;
    try {
      var snap = await get(videoRef(code));
      if (!snap.exists()){ $("landingErr").textContent = "No encontramos esa sala. Revisa el código."; return; }
      var v = snap.val();
      if (v.expiresAt && Date.now() > v.expiresAt){
        remove(ref(db, "rooms/" + code)).catch(function(){});
        $("landingErr").textContent = "Esa sala ya expiró.";
        return;
      }
      await joinAsParticipant(code);
      await push(chatRef(code), sysMsg(myName + " se unió a la sala 👋"));
      enterRoom(code);
    } catch(e){
      console.error(e);
      $("landingErr").textContent = "No se pudo unir a la sala. Revisa tu conexión e intenta de nuevo.";
    } finally {
      $("joinBtn").disabled = false;
    }
  });

  async function joinAsParticipant(code){
    var pRef = participantRef(code, clientId);
    await set(pRef, { name: myName, emoji: myEmoji, lastSeen: Date.now() });
    onDisconnect(pRef).remove();
  }

  function sysMsg(text){
    return { sys: true, text: text, at: Date.now() };
  }

  /* ---------------- entering room ---------------- */
  function enterRoom(code){
    roomCode = code;
    $("landingScreen").classList.add("hidden");
    $("roomScreen").classList.remove("hidden");
    $("roomCodeText").textContent = code;
    $("noVideoState").classList.remove("hidden");
    initPlayerIfReady();
    attachListeners(code);
    startHeartbeat(code);
  }

  $("roomCodeChip").addEventListener("click", function(){
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(roomCode).then(function(){ showToast("Código copiado: " + roomCode); });
    } else {
      showToast("Código de sala: " + roomCode);
    }
  });

  /* ---------------- realtime listeners ---------------- */
  function attachListeners(code){
    onValue(videoRef(code), function(snap){ applyVideoState(snap.val()); });
    onValue(participantsRef(code), function(snap){ renderParticipants(snap.val() || {}); });
    onChildAdded(chatRef(code), function(snap){ appendChatMessage(snap.val()); });
    onChildAdded(reactionsRef(code), function(snap){
      var r = snap.val();
      if (!r || r.from === clientId) return;
      spawnFloatingEmoji(r.emoji);
    });
  }

  function startHeartbeat(code){
    heartbeatTimer = setInterval(function(){
      if (currentExpiresAt && Date.now() > currentExpiresAt){
        handleRoomExpired();
        return;
      }
      update(participantRef(code, clientId), { lastSeen: Date.now() }).catch(function(){});
    }, 20000);
  }

  function handleRoomExpired(){
    clearInterval(heartbeatTimer);
    if (roomCode){
      remove(participantRef(roomCode, clientId)).catch(function(){});
      remove(ref(db, "rooms/" + roomCode)).catch(function(){});
    }
    roomCode = null;
    currentExpiresAt = null;
    $("roomScreen").classList.add("hidden");
    $("landingScreen").classList.remove("hidden");
    $("landingErr").textContent = "La sala expiró (duran " + ROOM_TTL_HOURS + " horas).";
  }

  /* ---------------- YouTube player ---------------- */
  window.onYouTubeIframeAPIReady = function(){ initPlayerIfReady(); };
  function initPlayerIfReady(){
    if (player || !window.YT || !window.YT.Player || !roomCode) return;
    player = new YT.Player("player", {
      height: "100%", width: "100%",
      playerVars: { controls: 1, rel: 0, playsinline: 1, modestbranding: 1, disablekb: 0, enablejsapi: 1 },
      events: {
        onReady: function(){ playerReady = true; },
        onStateChange: onPlayerStateChange
      }
    });
  }

  function onPlayerStateChange(e){
    if (applyingRemote || !roomCode) return;
    var state = e.data;
    if (state === 1 || state === 2){
      var isPlaying = (state === 1);
      var pos = player.getCurrentTime() || 0;
      setPlayIcon(isPlaying);
      var playlist = (player.getPlaylist && player.getPlaylist()) || [];
      var playlistIndex = (player.getPlaylistIndex && player.getPlaylistIndex());
      if (typeof playlistIndex !== "number" || playlistIndex < 0) playlistIndex = 0;
      var currentVideoId = (player.getVideoData && player.getVideoData().video_id) || lastKnownVideoId || null;
      if (lastKnownPlaylistId) {
        lastKnownPlaylistIndex = playlistIndex;
        lastKnownVideoId = currentVideoId;
      }
      update(videoRef(roomCode), {
        videoId: currentVideoId,
        playlistId: lastKnownPlaylistId,
        playlistIndex: lastKnownPlaylistId ? playlistIndex : 0,
        isPlaying: isPlaying,
        positionSec: pos,
        updatedAt: Date.now(),
        updatedBy: clientId
      }).catch(function(){});
    }
  }

  /* ---------------- transport controls ---------------- */
  $("playBtn").addEventListener("click", async function(){
    if (!playerReady || !lastKnownVideoId || !roomCode) return;
    var playing = player.getPlayerState() === 1;
    var pos = player.getCurrentTime() || 0;
    if (playing){ player.pauseVideo(); } else { player.playVideo(); }
    setPlayIcon(!playing);
    await update(videoRef(roomCode), {
      isPlaying: !playing, positionSec: pos, updatedAt: Date.now(), updatedBy: clientId
    }).catch(function(){});
  });

  $("backBtn").addEventListener("click", function(){ nudge(-10); });
  $("fwdBtn").addEventListener("click", function(){ nudge(10); });
  async function nudge(delta){
    if (!playerReady || !lastKnownVideoId || !roomCode) return;
    var pos = Math.max(0, (player.getCurrentTime()||0) + delta);
    player.seekTo(pos, true);
    await update(videoRef(roomCode), { positionSec: pos, updatedAt: Date.now(), updatedBy: clientId }).catch(function(){});
  }

  var scrubEl = $("scrub");
  scrubEl.addEventListener("input", function(){ isSeeking = true; });
  scrubEl.addEventListener("change", async function(){
    if (!playerReady || !lastKnownVideoId || !roomCode) return;
    var dur = player.getDuration() || 0;
    var pos = (scrubEl.value/100) * dur;
    player.seekTo(pos, true);
    isSeeking = false;
    await update(videoRef(roomCode), { positionSec: pos, updatedAt: Date.now(), updatedBy: clientId }).catch(function(){});
  });

  $("loadBtn").addEventListener("click", async function(){
    if (!roomCode) return;
    var raw = $("videoUrlInput").value;
    var media = parseYouTubeInput(raw);
    if (!media){ showToast("No reconozco ese video o playlist de YouTube."); return; }

    $("videoUrlInput").value = "";
    $("noVideoState").classList.add("hidden");

    if (media.type === "playlist") {
      lastKnownPlaylistId = media.playlistId;
      lastKnownPlaylistIndex = media.index || 0;
      lastKnownVideoId = media.videoId || null;
      if (playerReady) {
        player.loadPlaylist({
          listType: "playlist",
          list: media.playlistId,
          index: media.index || 0,
          startSeconds: 0
        });
        player.playVideo();
      }
      await set(videoRef(roomCode), {
        videoId: media.videoId || null,
        playlistId: media.playlistId,
        playlistIndex: media.index || 0,
        isPlaying: true,
        positionSec: 0,
        updatedAt: Date.now(),
        updatedBy: clientId
      }).catch(function(){});
      await push(chatRef(roomCode), sysMsg(myName + " puso una playlist nueva 🎶")).catch(function(){});
    } else {
      lastKnownVideoId = media.videoId;
      lastKnownPlaylistId = null;
      lastKnownPlaylistIndex = 0;
      if (playerReady){ player.loadVideoById(media.videoId); player.playVideo(); }
      await set(videoRef(roomCode), {
        videoId: media.videoId,
        playlistId: null,
        playlistIndex: 0,
        isPlaying: true,
        positionSec: 0,
        updatedAt: Date.now(),
        updatedBy: clientId
      }).catch(function(){});
      await push(chatRef(roomCode), sysMsg(myName + " puso un video nuevo 🎥")).catch(function(){});
    }
  });

  function setPlayIcon(playing){
    $("playIcon").classList.toggle("hidden", playing);
    $("pauseIcon").classList.toggle("hidden", !playing);
  }

  /* ---------------- chat ---------------- */
  $("sendBtn").addEventListener("click", sendChat);
  $("chatInput").addEventListener("keydown", function(e){ if (e.key === "Enter") sendChat(); });
  async function sendChat(){
    if (!roomCode) return;
    var text = $("chatInput").value.trim();
    if (!text) return;
    $("chatInput").value = "";
    await push(chatRef(roomCode), {
      from: clientId, name: myName, emoji: myEmoji, text: text, at: Date.now()
    }).catch(function(){});
  }

  /* ---------------- tabs ---------------- */
  $("tabChat").addEventListener("click", function(){
    $("tabChat").classList.add("active"); $("tabPeople").classList.remove("active");
    $("chatPanel").classList.remove("hidden"); $("peoplePanel").classList.add("hidden");
  });
  $("tabPeople").addEventListener("click", function(){
    $("tabPeople").classList.add("active"); $("tabChat").classList.remove("active");
    $("peoplePanel").classList.remove("hidden"); $("chatPanel").classList.add("hidden");
  });

  /* ---------------- reactions ---------------- */
  function spawnFloatingEmoji(emoji){
    var wrap = document.querySelector(".video-wrap");
    if (!wrap) return;
    var el = document.createElement("div");
    el.className = "float-emoji";
    el.textContent = emoji;
    el.style.left = (16 + Math.random()*60) + "%";
    wrap.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2300);
  }
  document.querySelectorAll(".reaction-btn").forEach(function(btn){
    btn.addEventListener("click", async function(){
      if (!roomCode) return;
      var emoji = btn.getAttribute("data-emoji");
      spawnFloatingEmoji(emoji);
      await push(reactionsRef(roomCode), { emoji: emoji, from: clientId, at: Date.now() }).catch(function(){});
    });
  });

  /* ---------------- applying remote video state ---------------- */
  function applyVideoState(v){
    if (!v) return;
    currentExpiresAt = v.expiresAt || null;
    if (!v.videoId && !v.playlistId) return;

    $("noVideoState").classList.add("hidden");

    if (v.playlistId) {
      var remoteIndex = Number(v.playlistIndex || 0);
      if (v.playlistId !== lastKnownPlaylistId || remoteIndex !== lastKnownPlaylistIndex) {
        lastKnownPlaylistId = v.playlistId;
        lastKnownPlaylistIndex = remoteIndex;
        lastKnownVideoId = v.videoId || null;
        if (playerReady) {
          player.loadPlaylist({
            listType: "playlist",
            list: v.playlistId,
            index: remoteIndex,
            startSeconds: v.positionSec || 0
          });
        }
      }
    } else if (v.videoId !== lastKnownVideoId || lastKnownPlaylistId) {
      lastKnownPlaylistId = null;
      lastKnownPlaylistIndex = 0;
      lastKnownVideoId = v.videoId;
      if (playerReady){ player.loadVideoById(v.videoId, v.positionSec||0); }
    }
    if (!playerReady) return;
    var expected = v.positionSec + (v.isPlaying ? (Date.now() - v.updatedAt)/1000 : 0);
    var actual = player.getCurrentTime() || 0;
    applyingRemote = true;
    if (!isSeeking && Math.abs(expected - actual) > 1.5){
      player.seekTo(expected, true);
    }
    var currentlyPlaying = player.getPlayerState() === 1;
    if (v.isPlaying && !currentlyPlaying){ player.playVideo(); }
    if (!v.isPlaying && currentlyPlaying){ player.pauseVideo(); }
    setPlayIcon(v.isPlaying);
    setTimeout(function(){ applyingRemote = false; }, 500);
  }

  /* ---------------- render loop for scrubber/time ---------------- */
  setInterval(function(){
    if (!playerReady || !player.getDuration || isSeeking) return;
    var dur = player.getDuration() || 0;
    var cur = player.getCurrentTime() || 0;
    if (dur > 0){
      scrubEl.value = (cur/dur)*100;
      $("curTime").textContent = fmtTime(cur);
      $("durTime").textContent = fmtTime(dur);
    }
  }, 500);

  /* ---------------- rendering people / chat ---------------- */
  function renderParticipants(participants){
    participants = participants || {};
    var now = Date.now();
    var active = Object.keys(participants).filter(function(id){
      return (now - (participants[id].lastSeen||0)) < 60000;
    });
    var stack = $("avatarStack");
    stack.innerHTML = "";
    active.slice(0,5).forEach(function(id){
      var p = participants[id];
      var d = document.createElement("div");
      d.className = "avatar";
      d.textContent = p.emoji || "🙂";
      stack.appendChild(d);
    });
    $("countBadge").textContent = active.length + (active.length===1 ? " persona" : " personas");

    var panel = $("peoplePanel");
    panel.innerHTML = "";
    active.forEach(function(id){
      var p = participants[id];
      var row = document.createElement("div");
      row.className = "person-row";
      row.innerHTML = '<div class="msg-avatar">'+(p.emoji||"🙂")+'</div>' +
        '<div><div class="person-name">'+escapeHtml(p.name||"Alguien")+(id===clientId?" (tú)":"")+'</div>' +
        '<div class="person-status">En la sala</div></div>';
      panel.appendChild(row);
    });
  }

  function appendChatMessage(m){
    if (!m) return;
    var log = $("chatLog");
    var atBottom = (log.scrollTop + log.clientHeight) >= (log.scrollHeight - 60);
    if (m.sys){
      var s = document.createElement("div");
      s.className = "sys-msg";
      s.textContent = m.text;
      log.appendChild(s);
    } else {
      var mine = m.from === clientId;
      var wrap = document.createElement("div");
      wrap.className = "msg" + (mine ? " me" : "");
      wrap.innerHTML = '<div class="msg-avatar">'+(m.emoji||"🙂")+'</div>' +
        '<div class="msg-body">' +
          (mine ? "" : '<div class="msg-name">'+escapeHtml(m.name||"Alguien")+'</div>') +
          '<div class="msg-text">'+escapeHtml(m.text)+'</div>' +
        '</div>';
      log.appendChild(wrap);
    }
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  /* ---------------- deep link join via #room=CODE ---------------- */
  window.addEventListener("load", function(){
    var m = location.hash.match(/room=([A-Z0-9]{5})/i);
    if (m){ $("codeInput").value = m[1].toUpperCase(); }
  });

})();
</script>
</body>
</html>
